<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada | TheusVision</title>
<script>
  // O Hub (/hub) é um app de uma página só: o GitHub Pages não conhece as rotas dele.
  // Qualquer /hub/alguma-rota volta para /hub/ levando a rota junto, e o app restaura.
  (function () {
    var l = window.location
    if (l.pathname.indexOf('/hub/') === 0) {
      var rota = l.pathname.slice('/hub/'.length)
      var busca = l.search ? '&' + l.search.slice(1) : ''
      l.replace('/hub/?rota=' + encodeURIComponent(rota) + busca + l.hash)
    }
  })()
</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0E0129;color:#EFEAF7;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;text-align:center;padding:24px}
  h1{font-size:28px;margin:0 0 10px}
  p{color:rgba(239,234,247,.72);margin:0 0 22px}
  a{color:#FF9F11;font-weight:700}
</style>
</head>
<body>
  <main>
    <h1>Página não encontrada</h1>
    <p>O endereço que você abriu não existe.</p>
    <a href="/">Voltar para o início</a>
  </main>
</body>
</html>
